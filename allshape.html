<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Shapes</title>
    <style>
        body {
           .label {
            margin-top: 8px;
            font-weight: bold;
        }
        .square {
            width: 80px;
            height: 80px;
            border: 3px solid #000;
        }

        .circle {
            width: 80px;
            height: 80px;
            border: 3px solid #000;
            border-radius: 50%;
        }

     
        .rectangle {
            width: 110px;
            height: 70px;
            border: 3px solid #000;
        }
    }
    </style>
</head>
<body>
    <div class="shape-box">
        <div class="square"></div>
        <div class="label">Square</div>
    </div>
    <div class="shape-box">
        <div class="circle"></div>
        <div class="label">Circle</div>
    </div>
     <div class="shape-box">
        <div class="rectangle"></div>
        <div class="label">Rectangle</div>
    </div>
</body>
</html>
